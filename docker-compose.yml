# CoffeePOS — PostgreSQL 17 + Backend NestJS + Frontend Next.js
#   Chỉ DB (để dev local):   docker compose up -d db
#   Toàn bộ:                 docker compose up -d --build
#   Web: http://localhost:3100 · API: http://localhost:4100/api · DB: localhost:5435
name: coffeepos

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: coffeepos
      TZ: UTC
    ports:
      # Server production đặt DB_BIND=127.0.0.1 để DB không lộ ra Internet
      - "${DB_BIND:-0.0.0.0}:${DB_PORT:-5435}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffeepos"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/coffeepos
      JWT_SECRET: ${JWT_SECRET:-coffeepos-dev-secret-doi-truoc-khi-deploy}
      PORT: 4100
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100}
      SEED: ${SEED:-true}
      # Bảo mật production (deploy.yml ghi vào .env): APP_ENV=production bắt buộc JWT_SECRET mạnh + SEED_PASSWORD
      APP_ENV: ${APP_ENV:-development}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-}
      TEST_REPORT_PATH: /app/reports/test-report.json
    volumes:
      # Báo cáo kiểm thử (npm run test:report) cho trang /quality — chỉ đọc
      - ./reports:/app/reports:ro
    ports:
      # Trình duyệt gọi API qua Next (/api/*); production đặt BACKEND_BIND=127.0.0.1
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-4100}:4100"
    # 127.0.0.1 chứ không phải localhost: Alpine có thể phân giải localhost → ::1 (IPv6), API chỉ nghe IPv4
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4100
        # Chỉ bật khi web chạy HTTPS — trình duyệt sẽ nhớ và từ chối HTTP
        ENABLE_HSTS: ${COOKIE_SECURE:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3100}:3000"

volumes:
  db-data:
